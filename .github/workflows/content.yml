# Publishes content/ to Cloudflare R2 (docs/backend-design.md §8a).
#
#   push to main touching content/  -> draft missing translations, check,
#                                      publish to staging
#   "Run workflow" / admin page     -> publish main to staging or production;
#                                      production also rewrites the
#                                      catalogue the app bundles from what
#                                      production now serves
#
# Only main is ever published or pushed: a run started on another branch
# skips the publish job and fails the not-main job instead. Each run uses the GitHub environment of its
# target ("staging" or "production"), so required reviewers can be set on
# production (Settings → Environments → production).
#
# Tests (tools/content, edge) run on every pull request in tools.yml.
#
# The admin page (the yournotalone-admin repository) commits item files to
# main, so a save there lands here.
# Commits this workflow makes (translations, bundled.json) use the built-in
# token, which doesn't start another run.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY  bucket-scoped Object Read & Write;
#                                           given only to the steps that use
#                                           R2 (fetching recordings,
#                                           publishing, bundling)
#   ANTHROPIC_API_KEY                       optional; drafts translations

name: Content
run-name: "Publish to ${{ inputs.env || 'staging' }}: ${{ github.event.head_commit.message || 'from the admin page' }}"

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "tools/content/**"
      - ".github/workflows/content.yml"
  workflow_dispatch:
    inputs:
      env:
        description: Where to publish
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: write

# One publish at a time, in order: each reads the version the last wrote.
concurrency:
  group: content
  cancel-in-progress: false

jobs:
  # "Run workflow" on any other branch: say why nothing happens, and fail.
  # (The publish job below doesn't even start, so it never reaches the
  # environment's secrets or reviewers.)
  not-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Only main is published
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Content is published only from main, not $REF. Merge first, then run the workflow on main."
          exit 1

  publish:
    if: github.ref == 'refs/heads/main'
    # The spare Azure server (yournotalone-ops repository), as the
    # unprivileged gha-runner user. ffmpeg is installed there, and the
    # workspace and converted audio persist between runs.
    runs-on: [self-hosted, linux, yournotalone-content]
    timeout-minutes: 45
    # Reviewers / branch rules for production go on this environment.
    environment: ${{ (inputs.env || 'staging') == 'production' && 'production' || 'staging' }}
    env:
      TARGET: ${{ inputs.env || 'staging' }}
    defaults:
      run:
        working-directory: tools/content
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/content/package-lock.json

      - name: Check ffmpeg
        working-directory: .
        run: ffmpeg -version | head -1

      - run: npm ci

      # Transcodes are keyed by the source's hash and settings, so they can
      # be kept between runs; a new recording just adds to the cache.
      - uses: actions/cache@v4
        with:
          path: |
            tools/content/.cache
            Sounds
          key: content-media-${{ hashFiles('content/masters.json') }}
          restore-keys: content-media-

      # Names come from the parsed YAML (spaces and all), never the shell.
      - name: Fetch the recordings items point at
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npm run masters -- download --used

      # A translation failure shouldn't hold back the English publish.
      - name: Draft missing translations
        if: env.TARGET == 'staging' && github.event_name == 'push'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY isn't set, so new items stay English-only until translated."
          else
            npm run translate -- --all --to fr,de,es,zh-Hans
          fi

      - name: Check
        run: npm run check

      - name: Commit the drafted translations
        if: env.TARGET == 'staging' && github.event_name == 'push'
        working-directory: .
        run: |
          git add content/items content/courses content/backgrounds
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Draft translations for review"
          git pull --rebase --quiet origin main
          git push origin HEAD:main

      - name: Publish to ${{ env.TARGET }}
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npm run publish -- --env "$TARGET"

      # The app ships with a copy of the catalogue for its first launch and
      # for offline use. It's copied from the snapshot production now
      # serves (read from the bucket), so its media keys are the files that
      # were actually uploaded.
      - name: Copy the published catalogue for the app to bundle
        if: env.TARGET == 'production'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npm run bundle -- --env production

      - name: Commit the bundled catalogue
        if: env.TARGET == 'production'
        working-directory: .
        run: |
          git add assets/catalog/bundled.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bundle the catalogue published to production"
          git pull --rebase --quiet origin main
          git push origin HEAD:main
