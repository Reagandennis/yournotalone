# Cloudflare Worker for the yournotalone app (docs/backend-design.md §5).
#
# Vars are NOT inherited by [env.*] blocks, so each environment repeats them.
# Secrets are set per environment with `wrangler secret put NAME --env <env>`:
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, REVENUECAT_SECRET_KEY,
#   REVENUECAT_PROJECT_ID, SENTRY_DSN (optional).
#
# The top-level block is what `wrangler dev` and the tests use. Deploy only
# with --env staging or --env production.

name = "yournotalone-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# @sentry/cloudflare needs AsyncLocalStorage, which comes with nodejs_compat.
compatibility_flags = ["nodejs_compat"]
workers_dev = true
upload_source_maps = true

[observability]
enabled = true

[triggers]
crons = ["0 3 * * *"]

[vars]
SUPABASE_URL = "https://zpcfavemnvfhqaxqhmri.supabase.co"
PUBLIC_BASE_URL = "https://database.techgetafrica.com/staging"
R2_ACCOUNT_ID = "f7e65097ea4facdba994ee51d751705a"
BUCKET = "yournotalone"
KEY_PREFIX = "staging/"
PRO_ENTITLEMENT_LOOKUP_KEY = "Techgetafrica Pro"
# RevenueCat's REST API identifier for "Techgetafrica Pro".
PRO_ENTITLEMENT_ID = "entl9d4c5b93da"

# Per-user rate limit (design §5). Cloudflare's docs don't list this binding as
# paid-only; if a free-plan deploy rejects it, delete this block — the code
# skips the check when the binding is absent.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# ---------------------------------------------------------------- staging
[env.staging]
name = "yournotalone-api-staging"
workers_dev = true

[env.staging.triggers]
crons = ["0 3 * * *"]

[env.staging.vars]
SUPABASE_URL = "https://zpcfavemnvfhqaxqhmri.supabase.co"
PUBLIC_BASE_URL = "https://database.techgetafrica.com/staging"
R2_ACCOUNT_ID = "f7e65097ea4facdba994ee51d751705a"
BUCKET = "yournotalone"
KEY_PREFIX = "staging/"
PRO_ENTITLEMENT_LOOKUP_KEY = "Techgetafrica Pro"
PRO_ENTITLEMENT_ID = "entl9d4c5b93da"

[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# ------------------------------------------------------------- production
[env.production]
name = "yournotalone-api"
workers_dev = true

[env.production.triggers]
crons = ["0 3 * * *"]

[env.production.vars]
SUPABASE_URL = "https://zpcfavemnvfhqaxqhmri.supabase.co"
PUBLIC_BASE_URL = "https://database.techgetafrica.com"
R2_ACCOUNT_ID = "f7e65097ea4facdba994ee51d751705a"
BUCKET = "yournotalone"
KEY_PREFIX = ""
PRO_ENTITLEMENT_LOOKUP_KEY = "Techgetafrica Pro"
PRO_ENTITLEMENT_ID = "entl9d4c5b93da"

[[env.production.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }
